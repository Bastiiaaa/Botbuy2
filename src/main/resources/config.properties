# -----------------------------------------------------------------------
# BotBuy Extension Configuration
# -----------------------------------------------------------------------

# Display name of the furni used to query habboapi.site
# This should match the name shown in the HabboAPI for your hotel.
furni.name=bufanda de serpiente

# Search query sent to the in-game Habbo marketplace
# Usually the same as furni.name, but can differ if Habbo uses a shorter name.
furni.search.query=bufanda de serpiente

# Maximum price in credits.
# The bot will buy the furni only if its price is less than or equal to this value.
max.price=5

# Hotel code for habboapi.site (com, de, es, fi, fr, it, nl, br, tr)
api.hotel=es

# How often (in seconds) the bot queries the API and searches the marketplace.
# Keep this at 10+ seconds to avoid flooding the server.
search.interval.seconds=10
